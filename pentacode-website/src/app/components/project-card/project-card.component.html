<div style="width: 24rem" class="card">
  <img class="card-img-top" height="200" style="object-fit: cover;" [src]="img.src" [alt]="img.alt">
  <div class="card-body">
    <div class="card-title">
      <h2>{{title}}</h2>
    </div>
    <ng-content></ng-content>
    <div class="mt-2">
      <a class="btn btn-outline-primary">See more!</a>
    </div>
  </div>
</div>
