<div class="background">
  <div class="contact-container">
    <div class="contact-header">Get in Touch</div>
    <form action="#" class="d-flex flex-column gap-3" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input class="form-control" type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
    <div class="mt-3 text-center">
      <p>Follow us on <a class="link" href="https://github.com/pentacodedev" target="_blank">GitHub</a></p>
    </div>
  </div>
</div>
